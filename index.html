```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Santa Tracker - North Pole</title>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #status {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.8);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="status">
  EARTH WORKING — LOADING SLEIGH...
</div>

<script>

// ==========================================
// SCENE
// ==========================================

const scene = new THREE.Scene();


// ==========================================
// EARTH
// ==========================================

const EARTH_RADIUS = 2;

const earthGeometry =
  new THREE.SphereGeometry(
    EARTH_RADIUS,
    64,
    64
  );

const earthMaterial =
  new THREE.MeshPhongMaterial({
    color: 0x2277cc
  });

const earth =
  new THREE.Mesh(
    earthGeometry,
    earthMaterial
  );

scene.add(earth);


// ==========================================
// CAMERA
// ==========================================

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

// View the top of the world
camera.position.set(
  0,
  5.5,
  4.5
);

camera.lookAt(
  0,
  0.6,
  0
);


// ==========================================
// RENDERER
// ==========================================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

document.body.appendChild(
  renderer.domElement
);


// ==========================================
// CONTROLS
// ==========================================

const controls =
  new THREE.OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;
controls.dampingFactor = 0.05;

controls.minDistance = 3;
controls.maxDistance = 12;

controls.target.set(
  0,
  0.6,
  0
);


// ==========================================
// LIGHTING
// ==========================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    1.5
  );

scene.add(ambientLight);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

directionalLight.position.set(
  5,
  8,
  5
);

scene.add(directionalLight);


// ==========================================
// EARTH TEXTURE
// ==========================================

const textureLoader =
  new THREE.TextureLoader();

textureLoader.load(

  "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",

  function(texture) {

    earth.material.map =
      texture;

    earth.material.color.set(
      0xffffff
    );

    earth.material.needsUpdate =
      true;

  }

);


// ==========================================
// SANTA SLEIGH
// ==========================================

const loader =
  new THREE.GLTFLoader();

loader.load(

  "santa_-_norad_santa_tracker.glb",

  function(gltf) {

    console.log(
      "SLEIGH LOADED!"
    );

    const santa =
      gltf.scene;


    // ======================================
    // SCALE
    // ======================================

    const box =
      new THREE.Box3()
        .setFromObject(santa);

    const size =
      new THREE.Vector3();

    box.getSize(size);

    const biggestDimension =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const desiredSize =
      0.40;

    const scale =
      desiredSize /
      biggestDimension;

    santa.scale.set(
      scale,
      scale,
      scale
    );


    // ======================================
    // CENTER MODEL
    // ======================================

    const centeredBox =
      new THREE.Box3()
        .setFromObject(santa);

    const center =
      centeredBox.getCenter(
        new THREE.Vector3()
      );

    santa.position.sub(
      center
    );


    // ======================================
    // SLEIGH ROTATION
    // ======================================

    santa.rotation.y =
      -Math.PI / 2;


    // ======================================
    // EXACT TOP OF THE WORLD
    // ======================================

    // Earth radius = 2
    //
    // North Pole = X 0, Y 2, Z 0
    //
    // Santa is only 0.12 above it.

    santa.position.x = 0;

    santa.position.y =
      EARTH_RADIUS + 0.12;

    santa.position.z = 0;


    // ======================================
    // ADD SANTA
    // ======================================

    scene.add(
      santa
    );


    console.log(
      "SANTA IS AT THE NORTH POLE"
    );

    console.log(
      santa.position
    );


    // ======================================
    // STATUS
    // ======================================

    document.getElementById(
      "status"
    ).innerHTML =
      "EARTH WORKING ✓ &nbsp; " +
      "SLEIGH LOADED ✓ &nbsp; " +
      "NORTH POLE ✓";

  },


  // ========================================
  // LOADING
  // ========================================

  function(xhr) {

    if (xhr.total) {

      const percent =
        Math.round(
          (xhr.loaded /
           xhr.total) * 100
        );

      document.getElementById(
        "status"
      ).innerHTML =
        "EARTH WORKING ✓ &nbsp; " +
        "LOADING SLEIGH " +
        percent +
        "%";

    }

  },


  // ========================================
  // ERROR
  // ========================================

  function(error) {

    console.error(
      "SLEIGH FAILED TO LOAD:",
      error
    );

    document.getElementById(
      "status"
    ).innerHTML =
      "EARTH WORKING ✓ &nbsp; " +
      "SLEIGH FAILED TO LOAD";

  }

);


// ==========================================
// ANIMATION
// ==========================================

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();


// ==========================================
// RESIZE
// ==========================================

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
```
